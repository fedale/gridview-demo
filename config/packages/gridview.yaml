fedale_gridview:
    # Framework theme: this demo is a Bootstrap 5 app (it loads Bootstrap CSS and
    # uses data-bs-theme), so the grid emits real Bootstrap classes for its leaf
    # elements (buttons) and follows Bootstrap's palette/dark mode via the preset.
    # Set to 'default' for the agnostic gv-* look, or 'tailwind' for utilities.
    theme: bootstrap5

    # Instant client-side i18n: ship the EN/ES/FR/IT catalogs to the browser. The demo
    # already exposes a locale in the route ({_locale}), so the in-grid switcher
    # stays off — the host drives the locale.
    i18n:
        locales: [en, es, fr, it]
        default: en
        client_domain: messages
        lang_switcher: true

    defaults:
        display:
            emptyText: 'No records found'
            showThead: true
            showTfoot: true
        behavior:
            useTurbo: true
        pagination:
            pageSizeOptions: [10, 20, 50, 100]
            maxPageSize: 100
        attributes:
            class: 'table table-striped'

    gridviews:
        # Read-only demo grid backed by https://dummyjson.com/users instead of
        # Doctrine. Grid id = strtolower(ReflectionClass(getDataClass())->getShortName())
        # -> App\Model\DummyJsonUser -> "dummyjsonuser". See
        # App\DataProvider\DummyJsonUserDataProvider and
        # App\Controller\Gridview\DummyJsonUserController.
        dummyjsonuser:
            dataProvider: App\DataProvider\DummyJsonUserDataProvider
