fedale_gridview:
    # End-user UI settings (gear menu → Settings): global defaults plus per-grid
    # overrides, stored in the database via fedale/setting-bundle.
    ui_settings:
        store: App\Gridview\SettingBundleUiSettingsStore
    # Framework theme: this demo is a Bootstrap 5 app (it loads Bootstrap CSS and
    # uses data-bs-theme), so the grid emits real Bootstrap classes for its leaf
    # elements (buttons) and follows Bootstrap's palette/dark mode via the preset.
    # Set to 'default' for the agnostic gv-* look, or 'tailwind' for utilities.
    theme: bootstrap5

    # Instant client-side i18n: ship the EN/ES/FR/IT catalogs to the browser. The demo
    # already exposes a locale in the route ({_locale}), so the in-grid switcher
    # stays off — the host drives the locale.
    i18n:
        locales: [en, es, fr, it]
        default: en
        client_domain: messages
        lang_switcher: true

    defaults:
        display:
            emptyText: 'No records found'
            showThead: true
            showTfoot: true
        behavior:
            useTurbo: true
            # Render CRUD forms with Symfony's Bootstrap 5 theme (this is a
            # Bootstrap app), so inputs get .form-control/.form-select/.form-check
            # instead of the bundle's unstyled gv-* hooks. Applies to every grid;
            # a controller can still override form.theme in viewConfig().
            formTheme: 'bootstrap_5_layout.html.twig'
        pagination:
            pageSizeOptions: [10, 20, 50, 100]
            maxPageSize: 100
        attributes:
            class: 'table table-striped'

    gridviews:
        # Read-only demo grid backed by https://dummyjson.com/users instead of
        # Doctrine. Grid id = strtolower(ReflectionClass(getDataClass())->getShortName())
        # -> App\Model\DummyJsonUser -> "dummyjsonuser". See
        # App\DataProvider\DummyJsonUserDataProvider and
        # App\Controller\Gridview\DummyJsonUserController. The endpoint shape
        # (users/total keys, /users/search) is described in that controller's
        # dataConfig()['model']; no custom provider class is needed anymore.
        dummyjsonuser:
            dataProvider: Fedale\GridviewBundle\DataProvider\JsonDataProvider

        # Read-only demo grid backed by the demo's OWN token-gated JSON API
        # (App\Controller\Api\InternalProductApiController), reached through the
        # same built-in JsonDataProvider. Proves a JSON endpoint that requires an
        # Authorization header works: the Bearer token is forwarded on every
        # request as a header set in the controller's dataConfig(). See
        # App\Controller\Gridview\InternalProductController.
        internalproduct:
            dataProvider: Fedale\GridviewBundle\DataProvider\JsonDataProvider

        # Read-only demo grid backed by the remote, token-gated reference API
        # (https://test-reference.waltertosto.it/api/references), reached through
        # the same built-in JsonDataProvider. The PHP counterpart of the Angular
        # "reference" screen; this first version renders only the "column"
        # category (sent as a fixed query param). Bearer token from
        # REFERENCE_API_TOKEN. See App\Controller\Gridview\ReferenceController.
        reference:
            dataProvider: Fedale\GridviewBundle\DataProvider\JsonDataProvider
