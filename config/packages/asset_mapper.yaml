framework:
    asset_mapper:
        # The paths to make available to the asset mapper. The gridview bundle
        # ships its Stimulus controllers under its own assets/ dir and declares
        # them in assets/package.json (symfony.controllers), so they're picked
        # up via assets/controllers.json — no manual copy/sync needed.
        paths:
            - assets/
            - namespace: '@fedale/gridview-bundle'
              value: vendor/fedale/gridview-bundle/assets
        missing_import_mode: strict
        excluded_patterns:
            - '*/assets/styles/**/_*.scss'

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
